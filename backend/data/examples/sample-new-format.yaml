metadata:
  title: Company System Landscape (New Format)
  description: Overview of all company systems and their interconnections
  version: '1.1'
  author: System Architecture Team

systems:
  - id: crm-system
    name: CRM System
    type: customer-facing
    description: Customer relationship management platform
    owner: Sales Team
    technology: Salesforce
  - id: billing-system
    name: Billing System
    type: backend
    description: Invoice and payment processing
    owner: Finance Team
    technology: Custom Python/Django
  - id: inventory-system
    name: Inventory Management
    type: backend
    description: Product and warehouse management
    owner: Operations Team
    technology: SAP
  - id: main-database
    name: Main Database
    type: database
    description: PostgreSQL primary database
    owner: IT Team
    technology: PostgreSQL 15
  - id: analytics-platform
    name: Analytics Platform
    type: analytics
    description: Business intelligence and reporting
    owner: Data Team
    technology: Tableau + Snowflake
  - id: external-payment
    name: Payment Gateway
    type: external
    description: External payment processor
    owner: Finance Team
    technology: Stripe

systems-positions:
  - id: crm-system
    x: 100
    y: 100
  - id: billing-system
    x: 400
    y: 100
  - id: inventory-system
    x: 700
    y: 100
  - id: main-database
    x: 400
    y: 300
  - id: analytics-platform
    x: 100
    y: 500
  - id: external-payment
    x: 700
    y: 300

systems-styles:
  - id: crm-system
    color: '#4A90E2'
    icon: users
  - id: billing-system
    color: '#E94B3C'
    icon: dollar-sign
  - id: inventory-system
    color: '#F39C12'
    icon: package
  - id: main-database
    color: '#336791'
    icon: database
  - id: analytics-platform
    color: '#8E44AD'
    icon: bar-chart
  - id: external-payment
    color: '#6772E5'
    icon: credit-card

connections:
  # Edge Type: DEFAULT (Bezier curve) + Solid line
  - from: crm-system
    to: billing-system
    label: Customer Orders (default/bezier)
    type: api
    description: REST API calls - DEFAULT edge type (curved bezier path)
    style:
      lineStyle: solid
      edgeType: default
      animated: false
  # Edge Type: STRAIGHT + Solid line
  - from: crm-system
    to: main-database
    label: Customer Data (straight)
    type: database
    description: Direct database connection - STRAIGHT edge type
    style:
      lineStyle: solid
      edgeType: straight
      animated: true
  # Edge Type: STEP + Solid line
  - from: billing-system
    to: main-database
    label: Store Invoices (step)
    type: database
    description: Invoice storage - STEP edge type (right angles)
    style:
      lineStyle: solid
      edgeType: step
      animated: true
  # Edge Type: SMOOTHSTEP + Dashed line
  - from: billing-system
    to: external-payment
    label: Process Payments (smoothstep)
    type: api
    description: Stripe API - SMOOTHSTEP edge type (rounded corners) + DASHED
    style:
      lineStyle: dashed
      edgeType: smoothstep
      animated: false
  # Edge Type: BEZIER + Solid line
  - from: inventory-system
    to: main-database
    label: Product Data (bezier)
    type: database
    description: Product information - BEZIER edge type (explicit curved)
    style:
      lineStyle: solid
      edgeType: bezier
      animated: true
  # Edge Type: STRAIGHT + Dotted line
  - from: inventory-system
    to: billing-system
    label: Stock Updates (straight+dotted)
    type: message-queue
    description: Real-time stock - STRAIGHT edge + DOTTED line style
    style:
      lineStyle: dotted
      edgeType: straight
      animated: true
  # Edge Type: SMOOTHSTEP + Dashed line
  - from: main-database
    to: analytics-platform
    label: Data Replication (smoothstep+dashed)
    type: database
    description: Nightly ETL - SMOOTHSTEP edge + DASHED line style
    style:
      lineStyle: dashed
      edgeType: smoothstep
      animated: false

groups:
  - id: customer-facing
    name: Customer-Facing Systems
    systems:
      - crm-system
    style:
      backgroundColor: '#E8F4F8'
      borderColor: '#4A90E2'
  - id: backend-core
    name: Core Backend Systems
    systems:
      - billing-system
      - inventory-system
      - main-database
    style:
      backgroundColor: '#FFF4E6'
      borderColor: '#F39C12'
